name: Wiki Lint & Deterministic Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run strict deterministic wiki-lint & quote-check
        run: python3 tools/wiki-lint.py --strict
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
